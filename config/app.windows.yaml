tools:
  ffprobe:
    path: C:/Program Files/ffmpeg/bin/ffprobe.exe

  avisynth:
    path: C:/Program Files/AviSynth

  ffmpeg:
    path: C:/Program Files/ffmpeg/bin/ffmpeg.exe

  virtualdub:
    executable: C:/Program Files/VirtualDub2/vdub64.exe
    path_mode: windows
    path_mappings: []
    env: {}

paths:
  workflows: workflows
  avisynth: C:/Program Files/AviSynth/plugins64+

processing:
  output_dir: ../output
  work_dir: ../work
  keep_temp_files: true
