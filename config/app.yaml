tools:
  ffprobe:
    path: ffprobe

  ffmpeg:
    path: ffmpeg

  # Linux: VirtualDub2 is launched through Wine. Media paths use Wine drives;
  # the jobs argument keeps Windows separators but omits its Wine drive.
  virtualdub:
    executable: wine
    arguments:
      - /home/archeopternix/Virtualdub2/vdub64.exe
      - /r{{.JobsFile}}
      - /x
    path_mode: wine
    wine_drive: "Z:"
    path_mappings: []
    env: {}

paths:
  workflows: workflows
  avisynth_profiles: avisynth/profiles
  avisynth: /opt/avisynth/plugins64+
  virtualdub_codecs: virtualdub/codecs
  deshaker: virtualdub/deshaker.yaml

processing:
  output_dir: ../output
  work_dir: ../work
  keep_temp_files: true
