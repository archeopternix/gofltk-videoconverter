tools:
  ffprobe:
    path: ffprobe

  ffmpeg:
    path: ffmpeg

  # Linux: VirtualDub2 is launched through Wine. The jobs file and all media
  # paths are converted to Windows paths before VirtualDub sees them.
  virtualdub:
    executable: wine
    arguments:
      - /home/archeopternix/Virtualdub2/VirtualDub64.exe
      - /s{{.JobsFileWindows}}
      - /x
    path_mode: wine
    wine_drive: "Z:"
    path_mappings: []
    env: {}

paths:
  workflows: workflows
  avisynth_profiles: avisynth/profiles
  avisynth: /opt/avisynth/plugins64+
  virtualdub_codecs: virtualdub/codecs
  deshaker: virtualdub/deshaker.yaml

processing:
  output_dir: ../output
  work_dir: ../work
  keep_temp_files: false
